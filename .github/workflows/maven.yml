name: CI - Java & Spring Boot

# Define quando o pipeline deve ser executado
on:
  push:
    branches: [ develop, main, feat/create-CI ]
  pull_request:
    branches: [ develop, main, feat/create-CI ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Baixa o código do repositório para o servidor do GitHub
      - name: Checkout do código
        uses: actions/checkout@v4

      # 2. Configura o Java 21 (igual ao que usamos no Dockerfile)
      - name: Configurar o Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven' # Salva em cache as dependências para o build rodar mais rápido

      # 3. Compila o projeto e roda os testes usando o Maven
      - name: Compilar com Maven
        run: mvn clean verify -DskipTests=false

      # 4. Teste da imagem do docker
      - name: Testar build da imagem Docker
        run: docker build -t zelar-backend:test .
    # Optional: Uploads the full dependency graph to GitHub to improve the quality of Dependabot alerts this repository can receive
      - name: Update dependency graph
        uses: advanced-security/maven-dependency-submission-action@571e99aab1055c2e71a1e2309b9691de18d6b7d6
