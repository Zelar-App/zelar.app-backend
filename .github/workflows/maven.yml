name: CI - Java & Spring Boot

on:
  push:
    branches: [develop, stage, main]

  pull_request:
    branches: [develop, stage, main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Configurar o Java 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
        cache: 'maven'

    - name: Grant execute permission for Maven Wrapper
      run: chmod +x mvnw

    - name: Compilar e executar testes
      run: ./mvnw clean verify

    - name: Testar build da imagem Docker
      run: docker build -t zelar-backend:test .

  validate-postgres-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: zelar_migrations_test
          POSTGRES_USER: zelar_test
          # Credencial exclusiva do container temporario de CI.
          POSTGRES_PASSWORD: postgres-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zelar_test -d zelar_migrations_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB09_TEST_URL: jdbc:postgresql://localhost:5432/zelar_migrations_test
      DB09_TEST_USERNAME: zelar_test
      DB09_TEST_PASSWORD: postgres-ci-only
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4
      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
      - name: Permitir execucao do Maven Wrapper
        run: chmod +x mvnw
      - name: Validar migrations e constraints em PostgreSQL
        run: ./mvnw -B -Dtest=AnexoMigrationIntegrationTest test
