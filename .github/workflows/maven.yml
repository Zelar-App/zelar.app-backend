name: CI - Java & Spring Boot

on:
  push:
    branches: [ develop, main, feat/create-CI ]
  pull_request:
    branches: [ develop, main, feat/create-CI ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Configurar o Java 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
        cache: 'maven'

    - name: Compilar com Maven
      run: mvn clean verify -DskipTests=false

    - name: Testar build da imagem Docker
      run: docker build -t zelar-backend:test .
