# ===================================================================
# CONFIGURACOES DO SERVIDOR
# ===================================================================
server.port=${SERVER_PORT:8080}
spring.application.name=zelar-app-backend

# ===================================================================
# BANCO DE DADOS (SUPABASE POSTGRESQL)
# ===================================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# ===================================================================
# SUPABASE CLIENT / CREDENCIAIS PUBLICAS
# ===================================================================
supabase.publishable.key=${SUPABASE_PUBLISHABLE_KEY}

# ===================================================================
# SEGURANCA E JWT
# ===================================================================
# JWT_SECRET: gere com o comando no .env.example (minimo 32 bytes em Base64)
security.jwt.secret=${JWT_SECRET}
security.jwt.issuer=${JWT_ISSUER:zelar.app}
security.jwt.token-duration=${JWT_TOKEN_DURATION:PT1H}

# Fotografias opcionais: ativar somente com bucket privado configurado.
app.fotografias.habilitado=${FOTOGRAFIAS_HABILITADAS:false}
app.fotografias.url=${SUPABASE_STORAGE_URL:}
app.fotografias.bucket=${SUPABASE_STORAGE_BUCKET:ocorrencias-fotografias}
app.fotografias.secret-key=${SUPABASE_STORAGE_SECRET_KEY:}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
